/* Save a file in whichever way this page can:
   - published on claude.ai -> the downloads capability (share sheet on the phone app)
   - opened as a plain file   -> an ordinary browser download            */
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // iPadOS reports as a Mac
}
// on the iPad the share sheet must open straight from the tap, so the PDF has to be ready first
const needsReadyFile = () => !(window.claude && typeof window.claude.use === "function") && isIOSDevice();
async function saveFile(filename, blob){
  if(window.claude && typeof window.claude.use === "function"){
    let dl = null;
    try{ dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
    if(dl){
      try{
        await dl.save({ filename, data: blob });
        return "saved";
      }catch(err){
        const code = err && err.code;
        if(code === "declined") return "declined";
        if(code === "rate_limited"){ toast("A save is already open — finish that one first"); return "busy"; }
        // anything else: fall through to a plain download attempt
      }
    }
  }
  if(isIOSDevice() && navigator.share && navigator.canShare){
    // iPads and iPhones save reliably through the share sheet ("Save to Files")
    const types = [blob.type || "application/octet-stream"];
    if(/json/.test(types[0])) types.push("text/plain");      // some versions only share JSON as text
    for(const t of types){
      try{
        const f = new File([blob], filename, { type: t });
        if(!navigator.canShare({ files: [f] })) continue;
        await navigator.share({ files: [f] });
        return "saved";
      }catch(err){
        if(err && err.name === "AbortError") return "declined";
        break;                                                 // fall back to a normal download
      }
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return "saved";
  }catch(e){ return "failed"; }
}

/* ────────── account storage ──────────
   On claude.ai, everything is kept in the viewer's own private space
   (data/users/<id>/) so it survives closing the browser and follows the
   account across devices. Opened as a plain file, the page has no
   account and keeps data in this browser only. */
const Cloud = { on:false, col:null, written:{}, busy:false, again:false, retry:null };
let syncTimer = null;

const docIdFor = sid => "stu_" + String(sid).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 180);
const clone = o => JSON.parse(JSON.stringify(o));

// what each account document should contain right now
function cloudDocs(){
  const want = {};
  students.forEach(st => { want[docIdFor(st.id)] = JSON.stringify(st); });
  const base = Object.assign({}, settings); delete base.sig;
  want.settings = JSON.stringify(base);
  if(settings.sig) want.sig  = JSON.stringify({ data: settings.sig });
  if(logoData)     want.logo = JSON.stringify({ data: logoData });
  if(markData)     want.logoMark = JSON.stringify({ data: markData });
  return want;
}

function queueSync(){
  if(!Cloud.on) return;
  setSaveState("saving", "Saving…");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncCloud(); }, 500);
}

async function syncCloud(){
  if(!Cloud.on) return;
  if(Cloud.busy){ Cloud.again = true; return; }
  Cloud.busy = true;
  clearTimeout(Cloud.retry);
  try{
    const want = cloudDocs();
    for(const k of Object.keys(want)){                       // one write at a time
      if(Cloud.written[k] !== want[k]){
        await Cloud.col.doc(k).set(JSON.parse(want[k]));
        Cloud.written[k] = want[k];
      }
    }
    for(const k of Object.keys(Cloud.written)){              // removed students / images
      if(!(k in want)){ await Cloud.col.doc(k).delete(); delete Cloud.written[k]; }
    }
    const when = new Date().toISOString();
    try{ localStorage.setItem(LASTSAVE, when); }catch(e){}
    setSaveState("ok", savedLabel(when));
  }catch(err){
    const code = err && err.code;
    if(code === "quota_exceeded"){
      setSaveState("error", "Account storage is full — not saved");
    } else if(code === "invalid_argument"){
      setSaveState("error", "Couldn't save one item to your account");
    } else if(code === "revoked" || code === "not_granted" || code === "capability_disabled"){
      Cloud.on = false;
      setSaveState("error", "Lost connection to your account — saving on this device only");
    } else {
      setSaveState("error", "Not saved yet — retrying…");
      Cloud.retry = setTimeout(syncCloud, 4000 + Math.random()*2000);
    }
  }finally{
    Cloud.busy = false;
    if(Cloud.again){ Cloud.again = false; syncCloud(); }
  }
}

// read everything from the account into the app
async function pullCloud(){
  const snap = await Cloud.col.get();
  const docs = {};
  snap.docs.forEach(d => { if(d.exists) docs[d.id] = clone(d.data()); });
  const stuKeys = Object.keys(docs).filter(k => k.indexOf("stu_") === 0);
  const found = stuKeys.length || docs.settings || docs.logo || docs.sig;
  if(!found) return false;

  students = stuKeys.map(k => migrate(docs[k]))
                    .sort((a,b) => String(a.name||"").localeCompare(String(b.name||"")));
  settings = Object.assign({ studio:"", rate:0, blockRate:0, payName:"", bsb:"", acct:"", abn:"", sig:null },
                           docs.settings || {});
  settings.sig = docs.sig ? docs.sig.data : null;
  logoData = docs.logo ? docs.logo.data : null;
  markData = docs.logoMark ? docs.logoMark.data : null;

  // remember what's already stored, so only real changes are written back
  Cloud.written = {};
  Object.keys(docs).forEach(k => {
    if(k.indexOf("stu_") === 0) Cloud.written[k] = JSON.stringify(students.find(x => docIdFor(x.id) === k));
  });
  const w = cloudDocs();
  if(docs.settings) Cloud.written.settings = w.settings;
  if(docs.sig)      Cloud.written.sig = w.sig;
  if(docs.logo)     Cloud.written.logo = w.logo;
  if(docs.logoMark) Cloud.written.logoMark = w.logoMark;

  // refresh this browser's cache
  try{ localStorage.setItem(KEY, JSON.stringify(students)); }catch(e){}
  try{ localStorage.setItem(SET, JSON.stringify(settings)); }catch(e){}
  try{ if(logoData) localStorage.setItem(LOGO, logoData); else localStorage.removeItem(LOGO); }catch(e){}
  try{ if(markData) localStorage.setItem(LOGO_MARK, markData); else localStorage.removeItem(LOGO_MARK); }catch(e){}
  return true;
}

async function connectCloud(){
  if(!(window.claude && typeof window.claude.use === "function")) return;   // plain file
  setSaveState("saving", "Connecting to your account…");
  let db = null, user = null;
  try{ [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); }catch(e){}
  if(!db || !user){ initSaveBar(); return; }
  let uid = null;
  try{ uid = await user.id(); }catch(e){}
  if(!uid){ initSaveBar(); return; }

  Cloud.col = db.collection("data/users/" + uid);
  try{
    const had = await pullCloud();
    Cloud.on = true;
    if(had){
      if(selectedId && !students.some(x => x.id === selectedId)) selectedId = null;
      render();
      setSaveState("ok", savedLabel(new Date().toISOString()));
    } else {
      // first visit with account storage: move this device's records up
      Cloud.written = {};
      await syncCloud();
    }
  }catch(e){
    Cloud.on = false;
    setSaveState("error", "Couldn't reach your account — saving on this device only");
  }
}

// coming back to the page (e.g. after using another device): pick up changes
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState !== "visible" || !Cloud.on) return;
  if(Cloud.busy || syncTimer) return;                 // don't overwrite unsaved edits
  if(document.querySelector("#modalRoot .overlay, #confirmRoot .overlay")) return;
  try{
    if(await pullCloud()){
      if(selectedId && !students.some(x => x.id === selectedId)) selectedId = null;
      render();
    }
  }catch(e){}
});

/* Keep images small enough for account storage (each item is limited in size). */
function shrinkImage(src, maxW){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxW / im.width);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res({ url: c.toDataURL("image/png"), w: im.width });
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}
async function fitImage(src){
  const LIMIT = 230000;
  let first = await shrinkImage(src, 700);
  if(!first) return null;
  if(src.length < LIMIT && first.w <= 700) return src;     // already small — keep as is
  let out = first.url;
  for(const w of [520, 380, 260]){
    if(out.length < LIMIT) break;
    const r = await shrinkImage(src, w); if(r) out = r.url;
  }
  return out.length < LIMIT ? out : null;
}

    '<div class="overlay"><div class="modal">'+
    "<h2>"+esc(title)+"</h2>"+
    '<textarea class="inp" id="txOut" readonly style="height:220px;font-size:13px;line-height:1.45;resize:vertical">'+esc(text)+"</textarea>"+
    '<div class="small" style="margin-top:8px">Press and hold, then Select All and Copy.</div>'+
    '<div class="acts"><button class="btn primary" id="txClose">Done</button></div>'+
    "</div></div>";
  document.getElementById("txClose").onclick = () => { root.innerHTML = ""; };
  const ta = document.getElementById("txOut"); ta.focus(); ta.select();
}

/* ────────── boot ────────── */
load(); render(); initSaveBar(); connectCloud();
if(!window.claude && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
setInterval(renderRoster, 60000); // keep "now" highlighting current
</script>
<script>
/* Lets the app open even without internet, once it has been opened online.
   Always tries the internet first, so updates you upload show up straight away. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
